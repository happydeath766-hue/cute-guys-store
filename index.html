<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cute Guys Store</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

</head>

<body>

    <!-- Pantalla de carga -->

    <div id="loading-screen">

        <h1 class="loading-title">CUTE GUYS STORE</h1>

        <p class="loading-subtitle">
            Suscripciones premium a tu alcance
        </p>

        <p id="loading-text">Conectando...</p>

        <div class="loader">
            <div class="bar"></div>
        </div>

    </div>

    <!-- Noticias -->

    <div id="news-banner">

        <span id="news-text">
            🔥 Nuevas suscripciones disponibles
        </span>

    </div>

    <!-- Panel de administrador -->

    <div id="admin-panel" style="display: none;">

        <h2>👑 Panel de administrador</h2>

        <button>🖼️ Cambiar imágenes</button>

        <button>💰 Cambiar precios</button>

        <button>📰 Editar noticias</button>

        <button>🎨 Cambiar colores</button>

    </div>

    <!-- Aplicación -->

    <div id="app" style="display: none;">

        <div class="header">

            <h1>CUTE GUYS STORE</h1>

            <p>Suscripciones premium exclusivas</p>

            <div class="header-line"></div>

        </div>

        <!-- TWINKS -->

        <div class="subscription-card" onclick="openProduct('TWINKS')">

            <img src="images/twinks.jpg">

            <div class="overlay">

                <h2>👑 TWINKS</h2>

                <p>Desde 15 USD</p>

            </div>

        </div>

        <!-- PROHIBIDO -->

        <div class="subscription-card" onclick="openProduct('PROHIBIDO')">

            <img src="images/prohibido.jpg">

            <div class="overlay">

                <h2>🔒 PROHIBIDO</h2>

                <p>Desde 15 USD</p>

            </div>

        </div>

        <!-- ADULTOS -->

        <div class="subscription-card" onclick="openProduct('ADULTOS')">

            <img src="images/adultos.jpg">

            <div class="overlay">

                <h2>⭐ ADULTOS</h2>

                <p>Desde 10 USD</p>

            </div>

        </div>

    </div>

    <!-- Menú inferior -->

<nav class="bottom-menu">

    <button onclick="location.reload()">
        🏠<br>Inicio
    </button>

    <button onclick="alert('🛒 Carrito vacío')">
        🛒<br>Carrito
    </button>

    <button onclick="alert('📊 Próximamente')">
        📊<br>Stats
    </button>

    <button onclick="alert('📰 Noticias actualizadas')">
        📰<br>Noticias
    </button>

    <button onclick="alert('📞 Contacto: @TuUsuario')">
        📞<br>Contacto
    </button>

    <button id="admin-btn" style="display:none;">
        👑<br>Admin
    </button>

</nav>

<script src="app.js"></script>

</body>

</html>
