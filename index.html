<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cute Guys Store</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

</head>

<body>

    <!-- Pantalla de carga -->

    <div id="loading-screen">

        <h1 class="loading-title">CUTE GUYS STORE</h1>

        <p class="loading-subtitle">
            Suscripciones premium a tu alcance
        </p>

        <p id="loading-text">Conectando...</p>

        <div class="loader">
            <div class="bar"></div>
        </div>

    </div>

    <!-- Noticias -->

    <div id="news-banner">

        <span id="news-text">
            🔥 Nuevas suscripciones disponibles
        </span>

    </div>

    <!-- Panel de administrador -->

    <div id="admin-panel" style="display: none;">

    <h2>👑 Panel de administrador</h2>

    <h3>👑 TWINKS</h3>

    <input type="file" id="twinks-input" accept="image/*">

    <button onclick="changeImage('twinks')">
        Guardar imagen
    </button>

    <h3>🔒 PROHIBIDO</h3>

    <input type="file" id="prohibido-input" accept="image/*">

    <button onclick="changeImage('prohibido')">
        Guardar imagen
    </button>

    <h3>⭐ ADULTOS</h3>

    <input type="file" id="adultos-input" accept="image/*">

    <button onclick="changeImage('adultos')">
        Guardar imagen
    </button>

    <button onclick="closeAdmin()">
        ⬅️ Volver
    </button>

</div>

    <!-- Aplicación -->

    <div id="app" style="display: none;">

<!-- Página del producto -->

<div id="product-page" style="display: none;">

    <button class="back-btn" onclick="goBack()">
        ⬅️ Volver
    </button>

    <h1 id="product-title"></h1>

    <div id="product-content"></div>

</div>

<div id="product-page" style="display:none;">

    <button onclick="goBack()">⬅️ Volver</button>

    <h1 id="product-title"></h1>

    <div id="product-content"></div>

</div>

        <div class="header">

            <h1>CUTE GUYS STORE</h1>

            <p>Suscripciones premium exclusivas</p>

            <div class="header-line"></div>

        </div>

        <!-- TWINKS -->

        <div class="subscription-card" onclick="openProduct('TWINKS')">

            <img id="img-twinks" src="images/twinks.jpg">

            <div class="overlay">

                <h2>👑 TWINKS</h2>

                <p>Desde 15 USD</p>

            </div>

        </div>

        <!-- PROHIBIDO -->

        <div class="subscription-card" onclick="openProduct('PROHIBIDO')">

            <img id="img-prohibido" src="images/prohibido.jpg">

            <div class="overlay">

                <h2>🔒 PROHIBIDO</h2>

                <p>Desde 15 USD</p>

            </div>

        </div>

        <!-- ADULTOS -->

        <div class="subscription-card" onclick="openProduct('ADULTOS')">

            <img id="img-adultos" src="images/adultos.jpg">

            <div class="overlay">

                <h2>⭐ ADULTOS</h2>

                <p>Desde 10 USD</p>

            </div>

        </div>

    </div>

    <!-- Menú inferior -->

<nav class="bottom-menu">

    <button onclick="location.reload()">
        🏠<br>Inicio
    </button>

    <button onclick="alert('🛒 Carrito vacío')">
        🛒<br>Carrito
    </button>

    <button onclick="alert('📊 Próximamente')">
        📊<br>Stats
    </button>

    <button onclick="alert('📰 Noticias actualizadas')">
        📰<br>Noticias
    </button>

    <button onclick="alert('📞 Contacto: @TuUsuario')">
        📞<br>Contacto
    </button>

    <button id="admin-btn" style="display:none;">
        👑<br>Admin
    </button>

    <button onclick="changeImage('TWINKS')">
    🖼️ Cambiar TWINKS
</button>

</nav>

<script src="app.js"></script>

</body>

</html>
